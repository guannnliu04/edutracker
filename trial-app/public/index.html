<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>線代測驗(測試版)</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="/katex/katex.min.css">
<script defer src="/katex/katex.min.js"></script>
<script defer src="/katex/auto-render.min.js"></script>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--card:#fff;--mut:#667;--ac:#2563eb;--ok:#15803d;--bad:#b91c1c;--line:#dde1e8}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--fg:#e8ecf3;--card:#1a2030;--mut:#9aa4b5;--ac:#6b9bff;--ok:#4ade80;--bad:#f87171;--line:#2b3347}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:#fff;width:100%;margin:6px 0}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.4}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mut);margin-right:4px}
label.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
label.opt.sel{border-color:var(--ac)}label.opt.right{border-color:var(--ok);background:rgba(21,128,61,.12)}label.opt.wrong{border-color:var(--bad);background:rgba(185,28,28,.12)}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}select{font:inherit;padding:8px;width:100%;border-radius:8px}
.banner{background:#fef3c7;color:#78350f;border-radius:8px;padding:6px 10px;font-size:13px}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const url=p=>{const a=p.replace('/api/','').split('/');return a[0]==='quiz'?`/api/index?op=${a[2]||'quiz'}&id=${a[1]}`:`/api/index?op=${a[0]}`};
const api=async(p,b)=>{const r=await fetch(url(p),b===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j;try{j=await r.json()}catch(e){throw new Error('伺服器回應異常('+r.status+')')}if(!r.ok)throw new Error(j.error);return j};
const ROLE={basic:'基礎',progress:'進度',bank:'題庫'},SRC={param_variant:'參數化變式',ai_generated:'AI 生成',bank_verified:'已驗證題庫'};
const ADJ={PERFECT_UP:'上一份 5/5 且無不確定 → 難度提高一階',PERFECT_AT_MAX:'上一份 5/5,已在最高難度',PERFECT_BUT_UNSURE:'上一份 5/5 但有不確定 → 維持難度並加 1 題進階',FOUR_OF_FIVE:'上一份 4/5 → 維持難度並加 1 題進階',THREE_OF_FIVE:'上一份 3/5 → 維持難度、加強答錯的觀念',LOW_DOWN:'上一份 0~2/5 → 降低難度、基礎優先',LOW_AT_MIN:'上一份 0~2/5,已在最低難度',NO_PREVIOUS:'第一份,使用正式 Level',"":''};
function math(){if(window.renderMathInElement)renderMathInElement(app,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});else setTimeout(math,300)}
const L='ABCD';
async function home(){const o=await api('/api/overview');
 const rows=o.quizzes.map(q=>`<div class="card" onclick="openQ(${q.id})"><b>#${q.id} ${q.kind==='daily'?'每日':'下一份'}</b> <span class="tag">第${q.day}天</span><span class="tag">Level ${q.level}</span><span class="tag">難度 ${q.base_difficulty}</span> ${q.submitted?`<b>${q.score}/5</b>`:'<span class="bad">未完成</span>'}</div>`).join('');
 const due=o.reviews.map(r=>`${r.concept}(第${r.due_day}天)`).join('、')||'無';
 app.innerHTML=`<h1>線代每日測驗 <span class="tag">測試版</span></h1><div class="banner">獨立測試資料,不連正式網站與資料庫。「新的一天」按鈕用來快轉 08:00。${o.storage==='redis'?'':'<br><b>⚠ 尚未設定測試資料庫:資料會在一段時間後遺失</b>'}</div>
 <div class="card">測試日 <b>第 ${o.day} 天</b> · 正式 Level <b>${o.level}</b><div class="mut">待複習:${due}</div><div class="mut">Level 紀錄:${o.level_log.map(l=>`第${l.day}天 L${l.from}→L${l.to}(${l.why})`).join(';')||'尚無變動'}</div></div>
 <button onclick="daily()">今日每日測驗</button><button class="sec" onclick="next_()">下一份測驗</button><button class="sec" onclick="adv()">進入新的一天(模擬 08:00)</button>${rows}<button class="sec" onclick="if(confirm('清空測試資料?'))api('/api/reset',{}).then(home)">重設測試資料</button>`}
async function daily(){openQ((await api('/api/daily',{})).id)} async function next_(){try{openQ((await api('/api/next',{})).id)}catch(e){alert(e.message)}}
async function adv(){await api('/api/advance_day',{});home()}
async function openQ(id){const q=await api('/api/quiz/'+id);q.submitted?result(q):take(q)}
let ST={};
function take(q){ST={id:q.id,a:q.items.map(()=>({selected:null,unsure:false}))};
 const p=q.plan;const warn=p.shortages.length?`<div class="banner">題目不足:缺 ${p.shortages.length} 題(不補未驗證題)</div>`:'';
 app.innerHTML=`<button class="sec" onclick="home()">← 返回</button><h1>${q.kind==='daily'?'每日測驗':'下一份測驗'} #${q.id}</h1>
 <div class="mut">Level ${q.level} · 難度 ${q.base_difficulty} · 來源比例 ${p.ratio}${ADJ[p.adjust_code]?' · '+ADJ[p.adjust_code]:''}</div>${warn}`+q.items.map((it,i)=>`<div class="card"><div>${it.is_review?'<span class="tag">複習</span>':''}<span class="tag">${ROLE[it.role]}</span><span class="tag">${it.concept}</span></div><p><b>${i+1}.</b> ${it.stem}</p>`+it.options.map((o,j)=>`<label class="opt" id="o${i}_${j}"><input type="radio" name="q${i}" onchange="pick(${i},${j})"> <b>${L[j]}.</b> ${o}</label>`).join('')+`<label class="mut"><input type="checkbox" onchange="ST.a[${i}].unsure=this.checked"> 不確定</label></div>`).join('')+
 `<button id="sub" disabled onclick="submit_()">交卷(五題都作答後才能交卷)</button>`;math()}
function pick(i,j){ST.a[i].selected=j;document.querySelectorAll(`[id^=o${i}_]`).forEach(e=>e.classList.remove('sel'));$(`#o${i}_${j}`).classList.add('sel');$('#sub').disabled=ST.a.some(x=>x.selected===null)}
async function submit_(){try{result(await api(`/api/quiz/${ST.id}/submit`,{answers:ST.a}))}catch(e){alert(e.message)}}
function result(q){const errs=ET;app.innerHTML=`<button class="sec" onclick="home()">← 返回</button><h1>結果 ${q.score}/5</h1><div class="mut">Level ${q.level} · 難度 ${q.base_difficulty}</div>`+q.items.map((it,i)=>`<div class="card"><div><span class="tag">${ROLE[it.role]}</span><span class="tag">${it.concept}</span><span class="tag">${SRC[it.source]}</span><span class="tag">難度 ${it.difficulty}</span><span class="tag">${it.angle}</span> ${it.correct?'<b class="ok">答對</b>':'<b class="bad">答錯</b>'}${it.unsure?' <span class="tag">不確定</span>':''}</div><p><b>${i+1}.</b> ${it.stem}</p>`+it.options.map((o,j)=>`<label class="opt ${j===it.answer_index?'right':(j===it.selected?'wrong':'')}"><b>${L[j]}.</b> ${o}</label>`).join('')+`<p><b>解析</b>:${it.explanation}</p>`+(it.correct?'':`<select onchange="setErr(${q.id},${it.pos},this.value)"><option value="">錯誤類型…</option>${errs.map(e=>`<option ${e===it.error_type?'selected':''}>${e}</option>`).join('')}</select><div class="mut">已安排 1/3/7 天後複習</div>`)+`</div>`).join('')+`<button onclick="next_()">下一份五題</button>`+(q.gen_log&&q.gen_log.length?`<details class="mut"><summary>出題紀錄 ${q.gen_log.length} 筆</summary>${q.gen_log.map(g=>`${g.stage}/${g.code}`).join('<br>')}</details>`:'');math()}
let ET=[];api('/api/overview').then(o=>ET=o.error_types);
async function setErr(id,pos,t){if(t)await api('/api/error_type',{quiz_id:id,pos,type:t})}
home();
</script></body></html>
